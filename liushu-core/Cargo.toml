[package]
name = "liushu-core"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
csv = "1.1"
pinyin = "0.9.0"
regex = "1.7.1"
itertools = "0.10.5"
thiserror = "1.0.39"
sha2 = "0.10.6"
data-encoding = "2.3.3"
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
